<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>남행열차 회원 사이트</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><h1 id="title"></h1><div class="who" id="who"></div></div></header>
<nav id="nav" hidden><div class="wrap" role="tablist"></div></nav>
<main><div class="wrap" id="main"></div></main>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
NH.start("회원 사이트", ["member", "staff", "owner"], user => {
  const staffLink = ["staff", "owner"].includes(user.role);
  NH.tabs([["notice", "공지"], ["meetup", "직관 모임"], ["free", "자유"], ["me", "내 정보"]], key => {
    if (key === "me") {
      const { h } = NH;
      return NH.$("main").replaceChildren(h("section", { class: "card" },
        h("h3", {}, "닉네임"), h("p", { class: "hint" }, "단톡방 닉네임과 똑같이 맞춰 주세요."), NH.nicknameForm(user),
        staffLink ? h("a", { href: "staff/" }, "운영진 방으로 가기") : null));
    }
    NH.board(key, user, { canWrite: key !== "notice" || staffLink });
  });
});
</script>
</body>
</html>
