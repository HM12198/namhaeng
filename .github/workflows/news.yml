name: 기아 기사 모으기

on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-bot
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_news.py news.json
      - name: 바뀌었으면 커밋
        run: |
          git config user.name "namhaeng-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "기사 업데이트" && git pull --rebase origin main && git push)
